apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: sbdt-ingress, namespace: uts-sbdt}
spec:
  ingressClassName: traefik
  rules:
    - host: auth.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 8081}}}
    - host: api.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: sbdt-api, port: {number: 8000}}}
